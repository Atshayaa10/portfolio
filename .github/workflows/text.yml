name: Python Syntax Test

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Create file with syntax error
        run: |
          echo 'def hello()' > test.py
          echo '    print("Missing colon")' >> test.py
      
      - name: Run Python file
        run: python test.py
