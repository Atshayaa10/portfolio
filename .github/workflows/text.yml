name: Test CI

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Create Python file with syntax error
        run: |
          cat > test.py << 'EOF'
          def hello()
              print("Missing colon!")
          
          hello()
          EOF
      
      - name: Run Python (will fail with syntax error)
        run: python test.py
